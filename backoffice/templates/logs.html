{% extends "base.html" %}
{% block title %}Logs{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-bold">Logs en tiempo real</h1>
  <!-- Filtro por servicio -->
  <div class="flex gap-2" id="filter-btns">
    {% for s, label in [("all", "Todos"), ("core", "Core"), ("ear", "Ear"), ("backoffice", "Backoffice")] %}
    <button onclick="setFilter('{{ s }}')"
            id="btn-{{ s }}"
            class="text-xs px-3 py-1.5 rounded-lg border transition-colors border-gray-700 text-gray-400 hover:text-white">
      {{ label }}
    </button>
    {% endfor %}
  </div>
</div>

<div class="bg-gray-950 border border-gray-800 rounded-xl p-4 h-[calc(100vh-340px)] overflow-y-auto font-mono text-xs mb-4"
     id="log-container">
  <div class="text-gray-600">Conectando…</div>
</div>

<!-- Log del satélite por panel (FASE 37.10) -->
<div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
  <div class="flex items-center gap-2 mb-3 text-sm flex-wrap">
    <span class="text-gray-400 font-semibold">Log de satélite</span>
    <select id="sat-node" class="bg-gray-800 border border-gray-700 rounded px-2 py-1">
      {% for n in nodes %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
      {% if not nodes %}<option value="">(sin paneles)</option>{% endif %}
    </select>
    <label class="text-gray-500">líneas <input id="sat-lines" type="number" min="1" max="500" value="100"
           class="bg-gray-800 border border-gray-700 rounded px-2 py-1 w-20"></label>
    <button onclick="fetchSatLog()" class="text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-gray-300 hover:text-white">Traer log</button>
    <span id="sat-status" class="text-gray-500 text-xs"></span>
  </div>
  <pre id="sat-log" class="bg-gray-950 border border-gray-800 rounded p-3 overflow-auto font-mono text-xs max-h-80 hidden"></pre>
</div>

<script>
let evtSource = null;
let currentFilter = 'all';

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('[id^="btn-"]').forEach(b => {
    b.classList.remove('bg-gray-700', 'text-white');
    b.classList.add('text-gray-400');
  });
  const btn = document.getElementById('btn-' + filter);
  if (btn) {
    btn.classList.add('bg-gray-700', 'text-white');
    btn.classList.remove('text-gray-400');
  }
  startStream(filter);
}

function startStream(filter) {
  if (evtSource) evtSource.close();
  const container = document.getElementById('log-container');
  container.innerHTML = '<div class="text-gray-600">Conectando a journalctl…</div>';

  evtSource = new EventSource('/logs/stream?service=' + filter);
  evtSource.onmessage = function(e) {
    const div = document.createElement('div');
    div.innerHTML = e.data;
    container.appendChild(div.firstChild);
    container.scrollTop = container.scrollHeight;
  };
  evtSource.onerror = function() {
    const div = document.createElement('div');
    div.className = 'text-red-400';
    div.textContent = '— stream desconectado —';
    container.appendChild(div);
  };
}

// Log del satélite por panel (37.10): fetch one-shot al proxy del backoffice.
async function fetchSatLog() {
  const node = document.getElementById('sat-node').value;
  const lines = parseInt(document.getElementById('sat-lines').value, 10) || 100;
  const status = document.getElementById('sat-status');
  const pre = document.getElementById('sat-log');
  if (!node) { status.textContent = 'no hay paneles'; return; }
  status.textContent = 'trayendo…';
  try {
    const r = await fetch(`/logs/satellite/${encodeURIComponent(node)}?lines=${lines}`);
    const data = await r.json();
    pre.textContent = r.ok ? (data.log || '(vacío)') : ('error: ' + (data.detail || r.status));
  } catch (e) { pre.textContent = 'error: ' + e.message; }
  pre.classList.remove('hidden');
  status.textContent = '';
}

// Iniciar con "all" activo
setFilter('all');
</script>
{% endblock %}
