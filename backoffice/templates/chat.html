<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitán — Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="h-full text-gray-100 flex flex-col bg-gray-950">

  <!-- Header -->
  <header class="shrink-0 bg-gray-900 border-b border-gray-800">
    <div class="flex items-center justify-between px-5 py-3">
      <!-- Izquierda: logo + usuario -->
      <div class="flex items-center gap-4">
        <a href="/conversations" class="text-lg font-bold tracking-tight hover:text-gray-300 transition-colors">⚓ Capitán</a>
        <span id="status-badge" class="hidden text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-300"></span>
        <span id="conv-badge" class="hidden text-[10px] font-mono px-2 py-0.5 rounded bg-gray-800 text-gray-500 border border-gray-700 select-all"></span>
        <!-- Usuario activo: visualmente separado de las acciones -->
        <div class="flex items-center gap-2 pl-3 border-l border-gray-700">
          <span class="text-xs text-gray-500 select-none">como</span>
          <div class="relative">
            <select id="user-select"
                    onchange="onUserChange()"
                    class="appearance-none text-sm bg-indigo-950 border border-indigo-700 rounded-lg pl-3 pr-7 py-1.5 text-indigo-200 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="">Invitado</option>
              {% for u in users %}
              <option value="{{ u.id }}">{{ u.name }}</option>
              {% endfor %}
            </select>
            <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-indigo-400 text-xs">▾</span>
          </div>
        </div>
      </div>
      <!-- Derecha: acciones -->
      <div class="flex items-center gap-1">
        <button onclick="newConversation()"
                title="Nueva conversación"
                class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-800 border border-gray-600 text-gray-200 hover:bg-gray-700 hover:border-gray-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button onclick="exportConversation()"
                title="Exportar conversación"
                class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 hover:text-gray-300 hover:bg-gray-800 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <a href="/dashboard"
           title="Administración"
           class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 hover:text-gray-300 hover:bg-gray-800 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Cuerpo: mensajes + panel lateral -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Mensajes -->
    <div id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-1.5"></div>

    <!-- Handle de colapsar/expandir: siempre visible en el borde derecho -->
    <button id="sidebar-btn"
            onclick="toggleSidebar()"
            title="Mostrar/ocultar contexto"
            class="shrink-0 w-5 flex items-center justify-center self-stretch bg-gray-900 border-l border-gray-800 text-gray-600 hover:text-gray-300 hover:bg-gray-800 transition-colors select-none">
      <span id="sidebar-arrow" class="text-[10px]">‹</span>
    </button>

    <!-- Panel lateral: conversaciones + intenciones (derecha) -->
    <aside id="sidebar"
           class="hidden w-80 shrink-0 border-l border-gray-800 bg-gray-900 flex flex-col overflow-hidden transition-all">

      <!-- Tabs -->
      <div class="flex border-b border-gray-800 text-xs font-medium">
        <button id="tab-convs" onclick="showTab('convs')"
                class="flex-1 py-2.5 text-center text-white bg-gray-800 border-b-2 border-blue-500">
          Historial
        </button>
        <button id="tab-intents" onclick="showTab('intents')"
                class="flex-1 py-2.5 text-center text-gray-500 hover:text-gray-300 transition-colors">
          Intenciones
        </button>
      </div>

      <!-- Panel historial -->
      <div id="panel-convs" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm">
        <div class="text-gray-600 text-xs py-4 text-center">Cargando…</div>
      </div>

      <!-- Panel intenciones -->
      <div id="panel-intents" class="hidden flex-1 overflow-y-auto p-3 text-sm">
        <div id="intents-no-user" class="text-gray-600 text-xs py-4 text-center">
          Seleccioná un usuario para ver sus intenciones activas
        </div>
        <div id="intents-list" class="hidden space-y-2"></div>
      </div>

    </aside>
  </div>

  <!-- Input fijo abajo -->
  <div class="shrink-0 border-t border-gray-800 bg-gray-900 px-4 py-4">
    <form id="chat-form" class="flex gap-3">
      <input
        id="chat-input"
        type="text"
        autocomplete="off"
        placeholder="Escribí tu mensaje…"
        class="flex-1 rounded-xl bg-gray-800 border border-gray-700 px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
      <button type="submit" id="send-btn"
              class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
        Enviar
      </button>
    </form>
  </div>

<script>
const messagesEl  = document.getElementById('messages');
const form        = document.getElementById('chat-form');
const input       = document.getElementById('chat-input');
const sendBtn     = document.getElementById('send-btn');
const statusBadge = document.getElementById('status-badge');
const convBadge   = document.getElementById('conv-badge');
const userSelect  = document.getElementById('user-select');
const sidebar     = document.getElementById('sidebar');

let activeConvId = null;
let _lastMsgDate = null;   // para separadores de fecha

const STORAGE_KEY = 'capitan_chat_history';
const USER_KEY    = 'capitan_chat_user';

const USERS = {
  {% for u in users %}"{{ u.id }}": "{{ u.name }}",
  {% endfor %}
};

// ── Usuario ───────────────────────────────────────────────────────────────────
if (userSelect) {
  const saved = localStorage.getItem(USER_KEY) || '';
  if (saved) userSelect.value = saved;
}

function onUserChange() {
  const uid = userSelect ? userSelect.value : '';
  localStorage.setItem(USER_KEY, uid);
  if (sidebarOpen) {
    if (activeTab === 'convs') loadConversationList();
    else loadIntents();
  }
}

function currentUserId()   { return userSelect ? userSelect.value : ''; }
function currentUserName() {
  const uid = currentUserId();
  return uid ? (USERS[uid] || uid) : null;
}

// ── Formatters ────────────────────────────────────────────────────────────────
function fmtMs(ms) {
  if (ms == null) return '';
  if (ms < 1000) return `${Math.round(ms)}ms`;
  return `${(ms / 1000).toFixed(1)}s`;
}

function fmtTime(ts) {
  const d = ts ? new Date(ts * 1000) : new Date();
  return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── localStorage ──────────────────────────────────────────────────────────────
function loadHistory() {
  _lastMsgDate = null;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    saved.forEach(t => appendBubble(t.role, t.text, t.meta, false, t.ts, t.userName));
  } catch (_) {}
}

function saveHistory() {
  const turns = Array.from(messagesEl.querySelectorAll('[data-role]')).map(el => ({
    role:     el.dataset.role,
    text:     el.querySelector('[data-text]')?.textContent || '',
    meta:     el.dataset.meta     ? JSON.parse(el.dataset.meta)   : null,
    ts:       el.dataset.ts       ? parseFloat(el.dataset.ts)     : null,
    userName: el.dataset.userName || null,
  }));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(turns.slice(-40))); } catch (_) {}
}

function newConversation() {
  localStorage.removeItem(STORAGE_KEY);
  activeConvId = null;
  convBadge.classList.add('hidden');
  _lastMsgDate = null;
  messagesEl.innerHTML = '';
  appendBubble('agent', 'Hola. ¿En qué te puedo ayudar?', null, false);
  const p = new URLSearchParams(location.search);
  if (p.has('conv_id')) { p.delete('conv_id'); history.replaceState(null, '', p.toString() ? `${location.pathname}?${p}` : location.pathname); }
  input.focus();
}

// ── Separadores de fecha ──────────────────────────────────────────────────────
function maybeDateSeparator(ts) {
  const d       = ts ? new Date(ts * 1000) : new Date();
  const dateKey = d.toDateString();
  if (dateKey === _lastMsgDate) return;
  _lastMsgDate  = dateKey;

  const today     = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  let label;
  if (dateKey === today)          label = 'Hoy';
  else if (dateKey === yesterday) label = 'Ayer';
  else                            label = d.toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' });

  const sep = document.createElement('div');
  sep.className = 'flex justify-center my-4 select-none';
  sep.innerHTML = `<span class="text-[10px] text-gray-500 bg-gray-900 px-3 py-0.5 rounded-full border border-gray-800">${escHtml(label)}</span>`;
  messagesEl.appendChild(sep);
}

// ── Burbujas ──────────────────────────────────────────────────────────────────
function appendBubble(role, text, meta = null, scroll = true, ts = null, userName = null) {
  const isUser = role === 'user';
  const nowTs  = ts || Math.floor(Date.now() / 1000);

  maybeDateSeparator(nowTs);

  const wrapper = document.createElement('div');
  wrapper.className    = 'flex ' + (isUser ? 'justify-end' : 'justify-start');
  wrapper.dataset.role = role;
  wrapper.dataset.ts   = nowTs;
  if (userName) wrapper.dataset.userName = userName;
  if (meta)     wrapper.dataset.meta     = JSON.stringify(meta);

  const bubble = document.createElement('div');
  bubble.className = [
    'max-w-[72%] rounded-2xl text-sm leading-relaxed px-4 pt-2 pb-1.5 shadow-sm',
    isUser ? 'rounded-tr-sm bg-blue-600 text-white'
           : 'rounded-tl-sm bg-gray-800 text-gray-100',
  ].join(' ');

  // Nombre del remitente (usuario solamente, cuando hay uno seleccionado)
  if (isUser && userName) {
    const nameEl = document.createElement('div');
    nameEl.className  = 'text-[10px] font-semibold text-blue-200 mb-0.5 tracking-wide';
    nameEl.textContent = userName;
    bubble.appendChild(nameEl);
  }

  const textEl = document.createElement('span');
  textEl.dataset.text = '';
  textEl.textContent  = text;
  bubble.appendChild(textEl);

  // Footer: hora [+ tildes para mensajes del usuario]
  const footer = document.createElement('div');
  footer.className = 'flex items-center justify-end gap-1 mt-1';

  const timeEl = document.createElement('span');
  timeEl.className  = isUser ? 'text-[10px] text-blue-200' : 'text-[10px] text-gray-500';
  timeEl.textContent = fmtTime(nowTs);
  footer.appendChild(timeEl);

  if (isUser) {
    const tickEl = document.createElement('span');
    tickEl.className   = 'tick text-[11px] text-gray-500 leading-none';
    tickEl.textContent = '✓';
    footer.appendChild(tickEl);
  }

  bubble.appendChild(footer);

  if (meta && !isUser) bubble.appendChild(buildChip(meta));

  wrapper.appendChild(bubble);
  messagesEl.appendChild(wrapper);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrapper, bubble, textEl, footer };
}

// ── Chip de metadata ──────────────────────────────────────────────────────────
function buildChip(meta) {
  const chip = document.createElement('div');
  chip.className = 'mt-2 text-xs text-gray-400';

  const isMulti   = meta.is_multi && meta.agent_ids && meta.agent_ids.length > 1;
  const agentLine = isMulti ? meta.agent_ids.join(' + ') : (meta.agent_id || '—');
  const latency   = meta.latency_ms != null ? fmtMs(meta.latency_ms) : '';
  const action    = meta.action ? ` · ${meta.action}` : '';

  let stepsHtml = '';
  if (meta.steps_detail && meta.steps_detail.length) {
    stepsHtml = meta.steps_detail.map((s, i) => {
      const cond = s.condition
        ? `<span class="text-yellow-700"> [${escHtml(s.condition)}]</span>`
        : '';
      const deps = s.depends_on && s.depends_on.length
        ? `<span class="text-gray-600"> ← #${s.depends_on.map(d => d + 1).join(',')}</span>`
        : '';
      return `
        <div class="py-0.5 leading-snug">
          <span class="text-gray-500 select-none">${i + 1}.</span>
          <span class="text-gray-300"> ${escHtml(s.agent)}</span>${cond}${deps}
          <div class="ml-3 text-gray-600 italic">${escHtml(s.query || '')}</div>
        </div>`;
    }).join('');
  }

  const planLabel = isMulti
    ? `Plan · ${meta.plan_steps || meta.steps_detail?.length} pasos`
    : 'Plan';

  const aggregationHtml = meta.aggregation
    ? `<div class="mt-1 text-gray-600 italic">síntesis: ${escHtml(meta.aggregation)}</div>`
    : '';

  const latencyRow = (meta.latency_ms != null || meta.coordinator_latency_ms != null) ? `
    <div class="mt-1.5 pt-1 border-t border-gray-800 text-gray-600 flex gap-3">
      ${meta.coordinator_latency_ms != null ? `<span>coord ${fmtMs(meta.coordinator_latency_ms)}</span>` : ''}
      ${meta.latency_ms            != null ? `<span>total ${fmtMs(meta.latency_ms)}</span>`             : ''}
    </div>` : '';

  chip.innerHTML = `
    <button class="hover:text-gray-200 transition-colors text-left"
            onclick="this.nextElementSibling.classList.toggle('hidden')">
      ▸ ${escHtml(agentLine)}${action} ${latency}
    </button>
    <div class="hidden mt-1.5 pl-2 border-l border-gray-700">
      <div class="text-gray-500 font-medium mb-1">${planLabel}</div>
      ${stepsHtml ? `<div class="space-y-0.5 mb-0.5">${stepsHtml}</div>` : `
        <div class="text-gray-600">agente: ${escHtml(meta.agent_id || '—')}</div>
        ${meta.action ? `<div class="text-gray-600">acción: ${escHtml(meta.action)}</div>` : ''}
      `}
      ${aggregationHtml}
      ${latencyRow}
    </div>`;
  return chip;
}

// ── Status badge ──────────────────────────────────────────────────────────────
function setStatus(phase, agent) {
  if (!phase) { statusBadge.classList.add('hidden'); return; }
  const labels = { coordinating: 'Coordinando…' };
  statusBadge.textContent = agent ? `${agent}…` : (labels[phase] || phase);
  statusBadge.classList.remove('hidden');
}

// ── Envío ─────────────────────────────────────────────────────────────────────
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  input.value = '';
  sendBtn.disabled = true;

  const { wrapper: userWrapper } = appendBubble('user', text, null, true, null, currentUserName());
  const tickEl = userWrapper.querySelector('.tick');

  const { wrapper: agentWrapper, textEl: agentTextEl, bubble: agentBubble } = appendBubble('agent', '');
  agentTextEl.innerHTML = '<span class="animate-pulse text-gray-500">…</span>';

  let fullText = '';
  const fd = new FormData();
  fd.append('text', text);
  fd.append('user_id', currentUserId());
  if (activeConvId) fd.append('conversation_id', activeConvId);

  try {
    const resp   = await fetch('/api/chat/send', { method: 'POST', body: fd });
    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let buf = '', currentEvent = 'message';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const data = JSON.parse(line.slice(6));
          if (currentEvent === 'status') {
            setStatus(data.phase, data.agent);
            if (data.phase === 'running' && tickEl) {
              tickEl.textContent = '✓✓';
              tickEl.className   = 'tick text-[11px] text-blue-400 leading-none';
            }
          } else if (currentEvent === 'token') {
            if (fullText === '') agentTextEl.textContent = '';
            fullText += data.text;
            agentTextEl.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (currentEvent === 'done') {
            fullText = data.response;
            agentTextEl.textContent = fullText;
            const isNewConv = !activeConvId && data.conversation_id;
            activeConvId = data.conversation_id;
            convBadge.textContent = activeConvId;
            convBadge.classList.remove('hidden');
            if (isNewConv) {
              const p = new URLSearchParams(location.search);
              p.set('conv_id', activeConvId);
              history.replaceState(null, '', `${location.pathname}?${p}`);
            }
            agentBubble.appendChild(buildChip(data));
            agentWrapper.dataset.meta = JSON.stringify(data);
            if (tickEl) {
              tickEl.textContent = '✓✓';
              tickEl.className   = 'tick text-[11px] text-sky-300 leading-none font-bold';
            }
          } else if (currentEvent === 'error') {
            agentTextEl.textContent = `Error: ${data.message}`;
            agentTextEl.className = 'text-red-400';
          }
          currentEvent = 'message';
        }
      }
    }
  } catch (err) {
    agentTextEl.textContent = `Error de conexión: ${err.message}`;
    agentTextEl.className = 'text-red-400';
  } finally {
    setStatus(null);
    sendBtn.disabled = false;
    input.focus();
    saveHistory();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.dispatchEvent(new Event('submit')); }
});

// ── Panel lateral: tabs ───────────────────────────────────────────────────────
let sidebarOpen = false;
let activeTab   = 'convs';

function toggleSidebar(forceOpen) {
  sidebarOpen = forceOpen !== undefined ? forceOpen : !sidebarOpen;
  sidebar.classList.toggle('hidden', !sidebarOpen);
  document.getElementById('sidebar-arrow').textContent = sidebarOpen ? '›' : '‹';
  if (sidebarOpen) {
    if (activeTab === 'convs') loadConversationList();
    else loadIntents();
  }
}

document.addEventListener('click', (e) => {
  if (!sidebarOpen) return;
  const path = e.composedPath();
  if (path.includes(sidebar)) return;
  if (path.includes(document.getElementById('sidebar-btn'))) return;
  toggleSidebar(false);
});

function showTab(tab) {
  activeTab = tab;
  document.getElementById('panel-convs').classList.toggle('hidden',   tab !== 'convs');
  document.getElementById('panel-intents').classList.toggle('hidden', tab !== 'intents');
  document.getElementById('tab-convs').className   = tabClass(tab === 'convs');
  document.getElementById('tab-intents').className = tabClass(tab === 'intents');
  if (tab === 'convs')   loadConversationList();
  if (tab === 'intents') loadIntents();
}

function tabClass(active) {
  return 'flex-1 py-2.5 text-center text-xs font-medium ' +
    (active ? 'text-white bg-gray-800 border-b-2 border-blue-500'
            : 'text-gray-500 hover:text-gray-300 transition-colors');
}

// ── Historial de conversaciones ───────────────────────────────────────────────
function timeAgo(ts) {
  const d = Math.floor(Date.now() / 1000 - ts);
  if (d < 60)    return 'ahora';
  if (d < 3600)  return `${Math.floor(d / 60)}m`;
  if (d < 86400) return `${Math.floor(d / 3600)}h`;
  return `${Math.floor(d / 86400)}d`;
}

const STATE_BADGE = {
  active:  'bg-green-900 text-green-300',
  closed:  'bg-gray-700 text-gray-400',
  expired: 'bg-orange-900 text-orange-300',
};

async function loadConversationList() {
  const panel = document.getElementById('panel-convs');
  panel.innerHTML = '<div class="text-gray-500 text-xs py-4 text-center">Cargando…</div>';
  try {
    const uid  = currentUserId();
    let list = await fetch('/api/chat/conversations').then(r => r.json());

    if (uid) {
      list = list.filter(c => (c.source_key || '').includes(`speaker_id=${uid}`));
    }

    if (!list.length) {
      panel.innerHTML = `<div class="text-gray-600 text-xs py-4 text-center">${uid ? 'Sin conversaciones para este usuario' : 'Sin conversaciones en esta sesión'}</div>`;
      return;
    }
    panel.innerHTML = list.map(c => `
      <button onclick="loadConversationDetail('${c.id}')"
              class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-800 transition-colors border border-transparent hover:border-gray-700">
        <div class="flex items-center justify-between mb-1">
          <span class="font-mono text-xs text-gray-400">${c.id}</span>
          <span class="text-xs px-1.5 py-0.5 rounded ${STATE_BADGE[c.state] || STATE_BADGE.closed}">${c.state}</span>
        </div>
        <div class="flex items-center justify-between text-xs text-gray-500">
          <span>${c.turns} turno${c.turns !== 1 ? 's' : ''}</span>
          <span>${timeAgo(c.updated_at)}</span>
        </div>
      </button>`).join('');
  } catch (err) {
    panel.innerHTML = `<div class="text-red-400 text-xs py-4 text-center">Error: ${err.message}</div>`;
  }
}

async function loadConversationDetail(convId) {
  const panel = document.getElementById('panel-convs');
  panel.innerHTML = '<div class="text-gray-500 text-xs py-4 text-center">Cargando…</div>';
  try {
    const conv = await fetch(`/api/chat/conversations/${convId}`).then(r => r.json());
    const back = `<button onclick="loadConversationList()" class="text-xs text-blue-400 hover:text-blue-300 mb-3 flex items-center gap-1">← Volver</button>`;
    if (!conv.turns.length) {
      panel.innerHTML = back + '<div class="text-gray-600 text-xs py-2 text-center">Sin turnos</div>';
      return;
    }

    resumeConversationInMain(conv);

    const turnsHtml = conv.turns.map(t => {
      const isUser = t.role === 'user';
      return `<div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-2">
        <div class="max-w-[90%] rounded-xl px-3 py-2 text-xs leading-relaxed ${isUser ? 'bg-blue-900 text-blue-100' : 'bg-gray-800 text-gray-300'}">
          ${t.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
        </div>
      </div>`;
    }).join('');
    panel.innerHTML = back +
      `<div class="text-xs text-emerald-400 mb-3 px-1">✓ Conversación cargada en el chat</div>` +
      turnsHtml;
  } catch (err) {
    panel.innerHTML = `<button onclick="loadConversationList()" class="text-xs text-blue-400 mb-3">← Volver</button>
      <div class="text-red-400 text-xs py-2 text-center">Error: ${err.message}</div>`;
  }
}

function resumeConversationInMain(conv) {
  activeConvId = conv.id;
  convBadge.textContent = activeConvId;
  convBadge.classList.remove('hidden');
  localStorage.removeItem(STORAGE_KEY);
  _lastMsgDate = null;
  messagesEl.innerHTML = '';

  conv.turns.forEach(t => {
    const role = t.role === 'user' ? 'user' : 'agent';
    const meta = (role === 'agent' && t.meta && Object.keys(t.meta).length) ? t.meta : null;
    appendBubble(role, t.content, meta, false, t.ts || null, null);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;

  statusBadge.classList.add('hidden');

  input.focus();
}

// ── Intenciones activas del usuario ──────────────────────────────────────────
const STATUS_COLORS = {
  pending:     'bg-yellow-900 text-yellow-300',
  in_progress: 'bg-blue-900 text-blue-300',
  done:        'bg-green-900 text-green-300',
  cancelled:   'bg-gray-700 text-gray-400',
};

const STATUS_LABEL = {
  pending:     'pendiente',
  in_progress: 'en curso',
  done:        'hecho',
  cancelled:   'cancelado',
};

async function loadIntents() {
  const uid      = currentUserId();
  const noUserEl = document.getElementById('intents-no-user');
  const listEl   = document.getElementById('intents-list');

  if (!uid) {
    noUserEl.classList.remove('hidden');
    listEl.classList.add('hidden');
    return;
  }
  noUserEl.classList.add('hidden');
  listEl.classList.remove('hidden');
  listEl.innerHTML = '<div class="text-gray-500 text-xs py-4 text-center">Cargando…</div>';

  try {
    const intents = await fetch(`/api/chat/users/${uid}/intents`).then(r => r.json());
    const active  = intents.filter(i => ['pending','in_progress'].includes(i.status));

    if (!active.length) {
      listEl.innerHTML = '<div class="text-gray-600 text-xs py-4 text-center">Sin intenciones activas</div>';
      return;
    }

    listEl.innerHTML = active.map(i => `
      <div class="px-3 py-2.5 rounded-lg bg-gray-800 border border-gray-700">
        <div class="flex items-start justify-between gap-2 mb-1">
          <span class="text-gray-200 text-xs font-medium leading-snug">${i.title}</span>
          <span class="text-xs px-1.5 py-0.5 rounded shrink-0 ${STATUS_COLORS[i.status] || ''}">${STATUS_LABEL[i.status] || i.status}</span>
        </div>
        ${i.description ? `<div class="text-gray-500 text-xs leading-snug mb-1">${i.description.replace(/</g,'&lt;')}</div>` : ''}
        <div class="text-gray-600 text-xs">${i.agent_id || ''}</div>
      </div>`).join('');
  } catch (err) {
    listEl.innerHTML = `<div class="text-red-400 text-xs py-4 text-center">Error: ${err.message}</div>`;
  }
}

// ── Exportar ──────────────────────────────────────────────────────────────────
function exportConversation() {
  const turns = Array.from(messagesEl.querySelectorAll('[data-role]')).map(el => ({
    role:     el.dataset.role,
    text:     el.querySelector('[data-text]')?.textContent || '',
    meta:     el.dataset.meta     ? JSON.parse(el.dataset.meta)   : undefined,
    ts:       el.dataset.ts       ? parseFloat(el.dataset.ts)     : undefined,
    userName: el.dataset.userName || undefined,
  }));
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), turns }, null, 2)],
                        { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href:     URL.createObjectURL(blob),
    download: `capitan-chat-${new Date().toISOString().slice(0,10)}.json`,
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const _urlParams = new URLSearchParams(location.search);
const urlUser    = _urlParams.get('user_id');
const urlConvId  = _urlParams.get('conv_id');

if (urlUser && userSelect) {
  userSelect.value = urlUser;
  localStorage.setItem(USER_KEY, urlUser);
}

if (urlConvId) {
  fetch(`/api/chat/conversations/${urlConvId}`)
    .then(r => r.json())
    .then(conv => resumeConversationInMain(conv))
    .catch(() => newConversation());
} else {
  _lastMsgDate = null;
  let loaded = false;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (saved.length) {
      loaded = true;
      saved.forEach(t => appendBubble(t.role, t.text, t.meta, false, t.ts, t.userName));
    }
  } catch (_) {}
  if (!loaded) newConversation();
}

input.focus();

// sidebar siempre cerrado al inicio
</script>
</body>
</html>
