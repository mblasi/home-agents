<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitán — Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="h-full text-gray-100 flex flex-col bg-gray-950">

  <!-- Header -->
  <header class="shrink-0 flex items-center justify-between px-5 py-3 bg-gray-900 border-b border-gray-800">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold tracking-tight">⚓ Capitán</span>
      <span id="status-badge" class="hidden text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-300"></span>
    </div>
    <div class="flex items-center gap-4">
      <!-- Selector de usuario -->
      {% if users %}
      <select id="user-select"
              class="text-sm bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-gray-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
        <option value="">Invitado</option>
        {% for u in users %}
        <option value="{{ u.id }}">{{ u.name }}</option>
        {% endfor %}
      </select>
      {% endif %}
      <a href="/dashboard"
         class="text-sm text-gray-400 hover:text-white transition-colors">
        Administración →
      </a>
    </div>
  </header>

  <!-- Mensajes -->
  <div id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
    <!-- Mensaje de bienvenida -->
    <div class="flex justify-start">
      <div class="max-w-[70%] rounded-2xl rounded-tl-sm px-4 py-3 bg-gray-800 text-gray-100 text-sm leading-relaxed">
        Hola. ¿En qué te puedo ayudar?
      </div>
    </div>
  </div>

  <!-- Input fijo abajo -->
  <div class="shrink-0 border-t border-gray-800 bg-gray-900 px-4 py-4">
    <form id="chat-form" class="flex gap-3">
      <input
        id="chat-input"
        type="text"
        autocomplete="off"
        placeholder="Escribí tu mensaje…"
        class="flex-1 rounded-xl bg-gray-800 border border-gray-700 px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
      <button
        type="submit"
        id="send-btn"
        class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Enviar
      </button>
    </form>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const form       = document.getElementById('chat-form');
const input      = document.getElementById('chat-input');
const sendBtn    = document.getElementById('send-btn');
const statusBadge = document.getElementById('status-badge');
const userSelect  = document.getElementById('user-select');

// ── Restore localStorage ──────────────────────────────────────────────────────
const STORAGE_KEY = 'capitan_chat_history';

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    saved.forEach(turn => appendBubble(turn.role, turn.text, turn.meta, false));
  } catch (_) {}
}

function saveHistory() {
  const bubbles = messagesEl.querySelectorAll('[data-role]');
  const turns = Array.from(bubbles).map(el => ({
    role: el.dataset.role,
    text: el.querySelector('[data-text]')?.textContent || '',
    meta: el.dataset.meta ? JSON.parse(el.dataset.meta) : null,
  }));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(turns.slice(-40))); } catch (_) {}
}

// ── Burbujas ──────────────────────────────────────────────────────────────────
function appendBubble(role, text, meta, scroll = true) {
  const isUser = role === 'user';
  const wrapper = document.createElement('div');
  wrapper.className = 'flex ' + (isUser ? 'justify-end' : 'justify-start');
  wrapper.dataset.role = role;
  if (meta) wrapper.dataset.meta = JSON.stringify(meta);

  const bubble = document.createElement('div');
  bubble.className = [
    'max-w-[70%] rounded-2xl px-4 py-3 text-sm leading-relaxed',
    isUser
      ? 'rounded-tr-sm bg-blue-600 text-white'
      : 'rounded-tl-sm bg-gray-800 text-gray-100',
  ].join(' ');

  const textEl = document.createElement('span');
  textEl.dataset.text = '';
  textEl.textContent = text;
  bubble.appendChild(textEl);

  if (meta && !isUser) {
    bubble.appendChild(buildChip(meta));
  }

  wrapper.appendChild(bubble);
  messagesEl.appendChild(wrapper);
  if (scroll) messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrapper, bubble, textEl };
}

function buildChip(meta) {
  const chip = document.createElement('div');
  chip.className = 'mt-2 text-xs text-gray-400';
  const agentLabel = meta.agent_id || '—';
  const latency    = meta.latency_ms != null ? `${meta.latency_ms}ms` : '';
  const action     = meta.action ? ` · ${meta.action}` : '';
  chip.innerHTML = `
    <button class="hover:text-gray-200 transition-colors" onclick="this.nextElementSibling.classList.toggle('hidden')">
      ▸ ${agentLabel}${action} ${latency}
    </button>
    <div class="hidden mt-1 pl-2 border-l border-gray-700 space-y-0.5">
      <div>Agente: <span class="text-gray-300">${meta.agent_id || '—'}</span></div>
      ${meta.action ? `<div>Acción: <span class="text-gray-300">${meta.action}</span></div>` : ''}
      ${meta.latency_ms != null ? `<div>Latencia: <span class="text-gray-300">${meta.latency_ms}ms</span></div>` : ''}
      ${meta.coordinator_latency_ms != null ? `<div>Coordinador: <span class="text-gray-300">${meta.coordinator_latency_ms}ms</span></div>` : ''}
    </div>`;
  return chip;
}

// ── Status badge ──────────────────────────────────────────────────────────────
const PHASE_LABELS = { coordinating: '🔄 Coordinando…', running: '⚙️ Ejecutando…' };

function setStatus(phase, agent) {
  if (!phase) { statusBadge.classList.add('hidden'); return; }
  statusBadge.textContent = agent
    ? `⚙️ ${agent}…`
    : (PHASE_LABELS[phase] || phase);
  statusBadge.classList.remove('hidden');
}

// ── Envío ─────────────────────────────────────────────────────────────────────
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  input.value = '';
  sendBtn.disabled = true;

  appendBubble('user', text);

  // Burbuja vacía del agente con cursor de carga
  const { wrapper: agentWrapper, textEl: agentTextEl, bubble: agentBubble } = appendBubble('agent', '');
  agentTextEl.innerHTML = '<span class="animate-pulse text-gray-500">…</span>';

  let fullText = '';
  let doneMeta = null;

  const fd = new FormData();
  fd.append('text', text);
  fd.append('user_id', userSelect ? userSelect.value : '');

  try {
    const resp = await fetch('/api/chat/send', { method: 'POST', body: fd });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let currentEvent = 'message';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          const data = JSON.parse(line.slice(6));
          if (currentEvent === 'status') {
            setStatus(data.phase, data.agent);
          } else if (currentEvent === 'token') {
            if (fullText === '') agentTextEl.textContent = '';
            fullText += data.text;
            agentTextEl.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (currentEvent === 'done') {
            doneMeta = data;
            fullText = data.response;
            agentTextEl.textContent = fullText;
            agentBubble.appendChild(buildChip(data));
            agentWrapper.dataset.meta = JSON.stringify(data);
          } else if (currentEvent === 'error') {
            agentTextEl.textContent = `Error: ${data.message}`;
            agentTextEl.className = 'text-red-400';
          }
          currentEvent = 'message';
        }
      }
    }
  } catch (err) {
    agentTextEl.textContent = `Error de conexión: ${err.message}`;
    agentTextEl.className = 'text-red-400';
  } finally {
    setStatus(null);
    sendBtn.disabled = false;
    input.focus();
    saveHistory();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});

// ── Ctrl+Enter / Enter ────────────────────────────────────────────────────────
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event('submit'));
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadHistory();
input.focus();
</script>
</body>
</html>
