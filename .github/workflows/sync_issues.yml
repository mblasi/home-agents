name: Sync plan → issues

on:
  push:
    branches: [main]
    paths:
      - masterplan/estado.md

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - run: python scripts/sync_issues.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
